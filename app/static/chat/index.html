<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{page_title}}</title>
    <link rel="stylesheet" href="/chat-assets/styles.css" />
  </head>
  <body>
    <main class="chat-shell" aria-label="Chat de suporte">
      <section class="chat-window" aria-live="polite">
        <header class="chat-header">
          <div class="avatar" aria-hidden="true">SF</div>
          <div>
            <span class="header-kicker">{{kicker}}</span>
            <h1>{{heading}}</h1>
            <p>{{subtitle}}</p>
          </div>
        </header>

        <section class="chat-intro" aria-label="Como funciona">
          <div class="intro-signals" aria-label="Sinais do atendimento">
            <span class="signal-pill">Sem login no V0</span>
            <span class="signal-pill">Código de suporte por resposta</span>
            <span class="signal-pill">Escalonamento humano quando necessário</span>
          </div>
          <p>{{intro}}</p>
        </section>

        <div id="messages" class="messages"></div>

        <section class="quick-prompts" aria-labelledby="quick-prompts-title">
          <div class="quick-prompts-header">
            <h2 id="quick-prompts-title">Perguntas rápidas</h2>
          </div>
          <div id="quick-prompts-list" class="quick-prompts-list"></div>
        </section>

        <form id="chat-form" class="composer" autocomplete="off">
          <label class="sr-only" for="message-input">Digite sua mensagem</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            maxlength="4000"
            placeholder="{{input_placeholder}}"
            required
          ></textarea>
          <button id="send-button" type="submit" aria-label="Enviar mensagem">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
          </button>
        </form>
        <p class="composer-note">{{composer_note}}</p>
      </section>
    </main>

    <script id="chat-config" type="application/json">{{chat_config_json}}</script>
    <script src="/chat-assets/app.js" defer></script>
  </body>
</html>
