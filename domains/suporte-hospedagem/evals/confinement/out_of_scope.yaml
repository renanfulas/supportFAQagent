  - id: confinement-hosp-financeiro
    category: confinement_out_of_scope
    question: Preciso resolver uma cobranca duplicada e pedir reembolso da fatura.
    expectation:
      should_escalate: true
      required_terms: []
      allowed_handoff_reasons:
        - out_of_scope
        - low_confidence
        - sensitive_topic
        - provider_error

  - id: confinement-hosp-supergator-ia
