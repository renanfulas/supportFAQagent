# Fase 1: base de conhecimento real reaproveitada dos artigos publicos da
# Central de Ajuda HostGator (categoria Primeiros Passos e relacionadas),
# parafraseada no formato do projeto.
#
# Padrao deterministico (igual aos dominios vivos): sem chave de provider, o
# fluxo escala por provider_error/low_confidence, entao todos os casos in-scope
# usam should_escalate:true e validam o RETRIEVAL pelo expected_references. Com
# a chave real configurada, o dominio responde de fato usando estes artigos.
domain: suporte-hospedagem
cases:
  - id: hosp-acessar-cpanel
    category: cpanel
    question: Como faco para acessar o cPanel da minha hospedagem compartilhada?
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - acessar-cpanel-hospedagem.md
      allowed_handoff_reasons:
        - low_confidence
        - provider_error

  - id: hosp-criar-email
    category: email_cpanel
