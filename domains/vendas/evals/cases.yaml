    category: rapport
    question: Oi, estou montando meu primeiro site e queria entender como voces de hospedagem podem me ajudar.
    expectation:
      should_escalate: true
      required_terms:
        - especialista
      allowed_handoff_reasons:
        - low_confidence
        - provider_error

