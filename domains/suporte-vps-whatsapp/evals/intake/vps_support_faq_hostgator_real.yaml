# Synthetic intake sourced from real HostGator support article titles.
#
# Source pattern: the public HostGator Central de Ajuda category tree
# (https://suporte.hostgator.com.br/hc/pt-br/categories/30807008626707 and its
# 16 sibling categories) was mapped article by article. Questions below were
# paraphrased from real article titles in the "VPS e Dedicados",
# "Especificacoes dos Servidores", "Seguranca" and "Aplicacoes e Ferramentas
# Externas" categories, kept inside the suporte-vps-whatsapp scope (VPS,
# Evolution API, WhatsApp, n8n, webhooks, automacoes). No article body text or
# customer data was copied; only the underlying intent.
#
# See evals/intake/hostgator-categories-mapping.md for the full category
# classification (in-scope vs out-of-scope) used to decide what went here
# versus into evals/confinement/out_of_scope.yaml.
#
# All cases keep expected_references empty on purpose: they are discovery
# candidates for knowledge curation, not yet promoted to pgvector_curated.yaml
# or pgvector_gate.yaml. Promoting a case means writing or pointing to a real
# article first, per docs/runbooks/anonymous-eval-intake.md.

