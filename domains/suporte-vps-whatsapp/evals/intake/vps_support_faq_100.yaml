# Synthetic anonymous intake for VPS support calibration.
#
# Source pattern: public support articles and help centers from hosting providers
# were reviewed to identify recurring VPS support intents. This file is not a
# raw customer report and should stay opt-in until pgvector, provider credentials,
# and curated knowledge are available in the private calibration environment.
#
# Questions with empty expected_references are intentional knowledge-curation
# candidates. Add or improve articles before turning those cases into a release
# gate.

