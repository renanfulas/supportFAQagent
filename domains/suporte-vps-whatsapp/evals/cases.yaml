domain: suporte-vps-whatsapp
cases:
  - id: evolution-nao-roda-vps
    category: setup_tecnico
    question: A Evolution API nao esta rodando na minha VPS, alguem pode ajudar?
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - evolution-instalacao.md
      allowed_handoff_reasons:
        - low_confidence
        - provider_error

