name: Phase 0 Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Privacy and workflow contracts
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      API_SECRET_KEY: local-dev-api-key
      RETRIEVAL_BACKEND: lexical
      PERSISTENCE_BACKEND: disabled
      WEB_AUTH_STORAGE_BACKEND: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Phase 0 contract gates
        run: |
          python -m pytest tests/test_phase0_operational_safety.py tests/test_n8n_workflow_contracts.py tests/test_webhook_ingress.py tests/test_privacy.py -q

  postgres:
    name: PostgreSQL migration and concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportfaq_phase0
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportfaq_phase0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PHASE0_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supportfaq_phase0
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supportfaq_phase0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migration and concurrency gates
        run: |
          python -m scripts.migrate status
          python -m scripts.migrate apply
          python -m scripts.migrate apply
          python -m scripts.migrate verify
          python -m pytest tests/integration/test_phase0_postgres.py -q
