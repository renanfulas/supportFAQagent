name: Phase 0 Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Privacy and workflow contracts
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      API_SECRET_KEY: local-dev-api-key
      RETRIEVAL_BACKEND: lexical
      PERSISTENCE_BACKEND: disabled
      WEB_AUTH_STORAGE_BACKEND: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Phase 0 contract gates
        run: |
          python -m pytest tests/test_phase0_operational_safety.py tests/test_migration_rollout_safety.py tests/test_outbox_webhook_signature.py tests/test_evolution_contracts.py tests/test_webhook_ingress.py tests/test_privacy.py tests/test_feedback_privacy_integrity.py tests/test_conversation_history.py tests/test_health_readiness.py tests/test_prune_operational_data.py tests/test_request_observability.py tests/test_zoom_security.py -q

  postgres:
    name: PostgreSQL migration and concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportfaq_phase0
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportfaq_phase0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PHASE0_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supportfaq_phase0
      PHASE0_TEST_DATABASE_DISPOSABLE: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supportfaq_phase0
      APP_ENV: staging
      API_SECRET_KEY: phase0-ci-api-key
      PERSISTENCE_BACKEND: postgres
      WEB_AUTH_STORAGE_BACKEND: postgres
      ENABLE_OUTBOX_INGRESS: "true"
      OUTBOX_WEBHOOK_SECRET: phase0-ci-outbox-secret
      RETRIEVAL_BACKEND: lexical
      PERSISTENCE_HASH_SECRET: phase0-ci-persistence-secret
      PERSISTENCE_HASH_VERSION: hmac-sha256-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migration and concurrency gates
        run: |
          python -m scripts.migrate status
          python -m scripts.migrate apply --target 006_conversations_messages.sql
          python -m scripts.backfill_conversation_privacy --verify-contract-ready --quiet-period-seconds 0
          python -m scripts.migrate apply
          python -m scripts.migrate apply
          python -m scripts.migrate verify
          python -m scripts.check_readiness
          python -m pytest tests/integration/test_phase0_postgres.py tests/integration/test_conversation_migration_upgrade.py tests/integration/test_feedback_privacy_integrity_postgres.py -q
