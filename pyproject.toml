[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportfaqagent"
version = "0.1.0"
description = "Plataforma modular em Python para agentes de atendimento por dominio com RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "langchain-anthropic>=1.4.3,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "requests>=2.32.0,<3.0.0",
]

[project.optional-dependencies]
chroma = [
    "langchain-chroma>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
